<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AIA</title>
<link rel="icon" href="/marke.svg" type="image/svg+xml">
<style>
  /* Eigene 404-Seite (04.09.) — liegt in oeffentlich/ und wandert unverändert
     in den Bau; GitHub Pages liefert 404.html automatisch bei jedem Treffer
     ins Leere. Bewusst so schweigsam wie das Coming-Soon-Tor: nur Marke,
     Zahl, Rückweg. */
  @font-face { font-family: "Big Shoulders"; src: url("/schriften/BigShoulders-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
  @font-face { font-family: Outfit; src: url("/schriften/Outfit-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0c0e13; color: #f5f6f7; font-family: Outfit, system-ui, sans-serif; display: grid; place-items: center; }
  .logo { position: absolute; left: 50%; top: clamp(36px, 7vh, 64px); translate: -50% 0; width: clamp(104px, 26vw, 150px); }
  main { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 0 24px; }
  h1 { font-family: "Big Shoulders", "Arial Narrow", sans-serif; font-weight: 700; font-size: clamp(96px, 26vw, 180px); line-height: 0.9; margin: 0; color: #f5f6f7; }
  h1 b { color: #c8ff4d; font-weight: inherit; }
  p { margin: 0; color: #9aa0ac; font-size: 16px; }
  a { display: inline-block; margin-top: 14px; background: #c8ff4d; color: #10130a; text-decoration: none; border-radius: 999px; padding: 13px 26px; font-size: 15px; font-weight: 600; }
  a:active { transform: scale(0.97); }
</style>
</head>
<body>
<img class="logo" src="/bildmarke.svg" alt="AIA">
<main>
  <h1>4<b>0</b>4</h1>
  <p>Hier ist nichts.</p>
  <a href="/">Zur Startseite</a>
</main>
</body>
</html>
